name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Cache GTest
        uses: actions/cache@v4
        with:
          path: build-debug/_deps
          key: gtest-${{ matrix.compiler }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset debug
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

      - name: Build
        run: cmake --build --preset debug

      - name: Test C++
        run: ctest --preset debug --label-regex 'cpp'

      - name: Test C
        run: ctest --preset debug --label-regex 'c'

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Cache GTest
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: gtest-asan-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure ASan
        run: cmake --preset asan

      - name: Build ASan
        run: cmake --build --preset asan

      - name: Test ASan
        run: ctest --preset asan
